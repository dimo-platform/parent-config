spring.application.name=parent-config
logging.level.com.dimo=error

# Open-Feign settings
## Clients
client.auth.service.url=${CLIENT_AUTH_SERVICE_URL:http://localhost:8090}

## Default settings
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=2000


# Resilience4j settings
## Circuit Breaker
resilience4j.circuitbreaker.instances.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.default.sliding-window-size=10
resilience4j.circuitbreaker.instances.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=10s


## Retry
resilience4j.retry.instances.default.max-attempts=2
resilience4j.retry.instances.default.wait-duration=200ms