name: Publish

# A tag such as v1.0.0 or v1.1.2-rc.2 publishes com.dimo:dimo-parent and
# com.dimo:parent-config at that version to GitHub Packages.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a SemVer tag (vMAJOR.MINOR.PATCH[-prerelease])" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set release version
        run: >
          ./mvnw -B -ntp
          org.codehaus.mojo:versions-maven-plugin:2.18.0:set
          -DnewVersion="${{ steps.version.outputs.value }}"
          -DgenerateBackupPoms=false
          -DprocessAllModules=true

      - name: Test and deploy to GitHub Packages
        run: >
          ./mvnw -B -ntp deploy
          -DaltDeploymentRepository=github::https://maven.pkg.github.com/dimo-platform/parent-config
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
